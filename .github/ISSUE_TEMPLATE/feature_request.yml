name: Feature request
description: Suggest something Manager of Tasks should do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: If it's something the Windows Task Manager does, mention where it is there.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
