name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        run: |
          NAME=manager-of-tasks-${GITHUB_REF_NAME}-x86_64-linux
          mkdir -p "$NAME"
          cp target/release/manager-of-tasks LICENSE README.md "$NAME/"
          cp -r assets scripts "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: manager-of-tasks-*.tar.gz
          generate_release_notes: true
